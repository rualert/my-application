# Стек "база данных": PostgreSQL, разворачивается/перезапускается независимо от приложения.
# Требует, чтобы сеть `elastic` уже существовала (создаётся ci/docker-compose.elk.yml) —
# это просто одна общая сеть для всех стеков, несмотря на "эластиковое" название.
# Запуск (из корня репозитория): docker compose -f ci/docker-compose.db.yml up -d

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      - POSTGRES_DB=myapplication
      - POSTGRES_USER=myapplication
      - POSTGRES_PASSWORD=myapplication
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapplication -d myapplication"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - elastic

networks:
  elastic:
    name: elastic
    external: true

volumes:
  postgres-data:
