# Отдаёт статику MyApplication.Web.UI и проксирует API-запросы на
# myapplication-api — единый origin для браузера, без CORS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заметка по бизнес-правилам (business-rules.md) может содержать текст до
    # 1 МБ — с учётом JSON-обвязки (заголовок, ключи, кавычки) тело запроса
    # может чуть превысить дефолтный лимит nginx (ровно 1m), и создание/правка
    # заметки на границе лимита падала бы с 413 ещё до API. Берём с запасом.
    client_max_body_size 2m;

    location / {
        try_files $uri /index.html;
    }

    location /Notes {
        proxy_pass http://myapplication-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Тот же origin нужен и для refresh-cookie (httpOnly, ставится API на
    # /Auth) — иначе браузер не будет её отправлять обратно.
    location /Auth {
        proxy_pass http://myapplication-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
