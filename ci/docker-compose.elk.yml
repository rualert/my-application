# Стек "окружение": Elasticsearch + Kibana, разворачивается независимо от приложения.
# Запуск (из корня репозитория): docker compose -f ci/docker-compose.elk.yml up -d

name: myapplication-infra

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - elastic

  # Принимает распределённые трейсы по OTLP (gRPC/HTTP на :8200) и пишет их в
  # Elasticsearch, откуда они видны в Kibana в разделе Observability -> APM.
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    container_name: apm-server
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    ports:
      - "8200:8200"
    command: >
      apm-server -e
        -E apm-server.host=0.0.0.0:8200
        -E apm-server.rum.enabled=false
        -E apm-server.auth.anonymous.enabled=true
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E setup.kibana.host=http://kibana:5601
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8200'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - elastic

networks:
  elastic:
    name: elastic

volumes:
  es-data:
