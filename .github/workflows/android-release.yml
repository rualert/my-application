name: android-release

# Выпускает APK для самостоятельной установки: собирает подписанную релизную
# сборку и прикладывает её к GitHub Release. Ссылка на такой файл открывается
# без входа в GitHub и ведёт прямо на APK — в отличие от артефакта сборки в
# android.yml, который отдаётся zip-архивом, только авторизованным и на время.
#
# Запускается пушем тега вида v1.0.0 (по нему же берётся имя версии). Отдельный
# workflow, а не job в android.yml: у того другой триггер (каждый PR), другой
# тип сборки и он намеренно обходится без доступа к ключу подписи.
#
# Что должно быть заведено в репозитории (Settings → Secrets and variables →
# Actions), помимо уже существующего GOOGLE_CLIENT_ID:
#   ANDROID_KEYSTORE_BASE64   — релизный keystore, закодированный base64
#   ANDROID_KEYSTORE_PASSWORD — пароль хранилища
#   ANDROID_KEY_ALIAS         — псевдоним ключа внутри хранилища
#   ANDROID_KEY_PASSWORD      — пароль ключа
# Отпечаток SHA-1 этого ключа обязан быть зарегистрирован в Android-клиенте
# OAuth проекта Google Cloud, иначе вход через Google в выпущенном APK не
# заработает (подробности и команды — в src/MyApplication.Android/README.md).

on:
  push:
    tags:
      - 'v*'

# Нужно для создания релиза и загрузки файла в него.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MyApplication.Android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Тег снимается с master, где тесты уже проходили, но сборка релиза —
      # последний момент, когда сломанный код ещё можно не выпускать наружу.
      - name: Тесты
        run: ./gradlew testDebugUnitTest

      # Файл кладётся за пределами рабочего каталога, чтобы ключ ни при каких
      # обстоятельствах не попал в сборку или в артефакты.
      - name: Восстановить keystore из секрета
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # versionName — из тега без ведущей «v»; versionCode — номер запуска
      # workflow: он растёт сам и никогда не повторяется, а Android требует
      # именно возрастающего числа, иначе APK не встанет поверх прежнего.
      - name: Собрать подписанный APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease \
            -PmyNotesApp.googleServerClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -PmyNotesApp.versionName="$version" \
            -PmyNotesApp.versionCode="${{ github.run_number }}" \
            -PmyNotesApp.releaseKeystore="$RUNNER_TEMP/release.keystore" \
            -PmyNotesApp.releaseKeystorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PmyNotesApp.releaseKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PmyNotesApp.releaseKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"
          mv app/build/outputs/apk/release/app-release.apk "MyNotesApp-$GITHUB_REF_NAME.apk"

      # gh предустановлен на раннере; стороннего action для релиза не нужно.
      - name: Создать релиз с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MyNotesApp-$GITHUB_REF_NAME.apk" \
            --title "Android $GITHUB_REF_NAME" \
            --notes "APK для самостоятельной установки. Скачайте файл на телефон и откройте его; система спросит разрешение на установку из неизвестного источника."
