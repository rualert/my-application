name: Tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: src/MyApplication/**/*.csproj

      - name: Restore
        working-directory: src/MyApplication
        run: dotnet restore

      - name: Build
        working-directory: src/MyApplication
        run: dotnet build --no-restore -c Release

      # SmokeTests поднимают PostgreSQL через Testcontainers — ubuntu-latest
      # runner уже имеет запущенный Docker, отдельная настройка не нужна.
      - name: Test
        working-directory: src/MyApplication
        run: dotnet test --no-build -c Release
