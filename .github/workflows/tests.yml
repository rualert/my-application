name: Tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: src/MyApplication/**/*.csproj

      - name: Restore
        working-directory: src/MyApplication
        run: dotnet restore

      - name: Build
        working-directory: src/MyApplication
        run: dotnet build --no-restore -c Release

      # SmokeTests поднимают PostgreSQL через Testcontainers — ubuntu-latest
      # runner уже имеет запущенный Docker, отдельная настройка не нужна.
      - name: Test
        working-directory: src/MyApplication
        run: dotnet test --no-build -c Release

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MyApplication.Web.UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Версия Node — как в ci/Dockerfile.web-ui.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/MyApplication.Web.UI/package-lock.json

      - name: Install
        run: npm ci --global=false

      # tsc -b + vite build: заодно проверяет типы и в самих тестах.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
