# "Database" stack: PostgreSQL, deployable/restartable independently of the app.
# Requires the `elastic` network to already exist (created by docker-compose.elk.yml) —
# it's just the one shared cross-stack network, despite the Elastic-flavored name.
# Run: docker compose -f docker-compose.db.yml up -d

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      - POSTGRES_DB=myapplication
      - POSTGRES_USER=myapplication
      - POSTGRES_PASSWORD=myapplication
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapplication -d myapplication"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - elastic

networks:
  elastic:
    name: elastic
    external: true

volumes:
  postgres-data:
