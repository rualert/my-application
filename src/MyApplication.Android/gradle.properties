org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# Адрес API по умолчанию — развёрнутый экземпляр в Railway: nginx там раздаёт
# веб-интерфейс и проксирует /Notes и /Auth на API (см. CLAUDE.md, «Railway
# deployment»). Переопределяется в local.properties или -PmyNotesApp.apiBaseUrl=...
myNotesApp.apiBaseUrl=https://web-ui-production-5b19.up.railway.app

# Идентификатор веб-клиента Google OAuth. В git не хранится (как и
# VITE_GOOGLE_CLIENT_ID у веб-интерфейса): задаётся в local.properties, которая
# в git не попадает, либо -PmyNotesApp.googleServerClientId=..., либо секретом в CI.
# Здесь — пустая заглушка, ровно как placeholder в appsettings.json у API.
myNotesApp.googleServerClientId=
